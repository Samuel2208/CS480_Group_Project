{% block content %}
<h2>Top-K Clients by Rent Count</h2>

<form method="POST">
  <label for="k">Enter K:</label>
  <input type="number" id="k" name="k" min="1" required>
  <button type="submit">Submit</button>
</form>

{% if clients %}
  <h3>Top {{ k }} Clients</h3>
  <ul>
    {% for client in clients %}
      <li><strong>{{ client.name }}</strong> ({{ client.email }}) - {{ client.rent_count }} rents</li>
    {% endfor %}
  </ul>
{% endif %}

<p><a href="{{ url_for('manager_dashboard', ssn=manager_ssn) }}">Return to Dashboard</a></p>

{% endblock %}
