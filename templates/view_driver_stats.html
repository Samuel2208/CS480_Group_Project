{% block content %}
<h2>Driver Rent & Rating Summary</h2>
<table border="1" cellpadding="6">
  <tr>
    <th>Driver Name</th>
    <th>Total Rents</th>
    <th>Average Rating</th>
  </tr>
  {% for row in stats %}
  <tr>
    <td>{{ row.name }}</td>
    <td>{{ row.total_rents }}</td>
    <td>{{ "%.2f"|format(row.avg_rating) if row.avg_rating is not none else "No Ratings" }}</td>
  </tr>
  {% endfor %}
</table>

<p><a href="{{ url_for('manager_dashboard', ssn=manager_ssn) }}">Return to Dashboard</a></p>

{% endblock %}
